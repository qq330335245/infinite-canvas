# Superseded by deploy-infinite-canvas.yml (build + Cloudflare Pages).
# Kept as a thin alias so old bookmarks still run a dist-only build.
name: Build web dist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile || bun install
      - name: Build
        working-directory: web
        env:
          VITE_BASE: /
        run: bun run build
      - name: SPA fallback
        run: |
          cp web/dist/index.html web/dist/404.html
          test -f web/dist/_redirects || printf '%s\n' '/*    /index.html   200' > web/dist/_redirects
      - uses: actions/upload-artifact@v4
        with:
          name: infinite-canvas-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 14
